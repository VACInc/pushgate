[project]
# Retained from 0.1.0 so upgrades continue to have one distribution owner.
name = "pushgate"
version = "1.0.2"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
description = "Self-hosted push-approval MFA for SSH and PAM"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn[standard]==0.54.0",
  "sqlalchemy==2.0.55",
  "pydantic-settings==2.16.2",
  "httpx==0.28.1",
  "pyotp==2.10.0",
  "cryptography==50.0.2",
  "redis==8.1.0",
]

[project.optional-dependencies]
postgres = [
  "psycopg[binary]==3.3.6",
]
test = [
  "pytest==9.2.0",
]

[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["server", "server.app", "pam", "pushgate"]

[tool.setuptools.package-dir]
pushgate = "sdk/pushgate"

[tool.pytest.ini_options]
pythonpath = ["server", "sdk", "."]
testpaths = ["qa", "pam"]
