name: CI
on: [push, pull_request]
# Deny everything by default; each job opts back in to the read-only scopes it needs.
permissions: {}
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r requirements.lock -r requirements-dev.lock
      - run: ruff check --select E9,F63,F7,F82 server pam sdk qa
      - name: Test without external network
        run: sudo env PATH="$PATH" unshare --net -- bash -c 'ip link set lo up; exec "$@"' bash python -m pytest -q qa pam sdk
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: admin-web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          # Never restore a shared npm cache into a build; npm ci verifies lockfile integrity hashes.
          package-manager-cache: false
      - run: npm ci
      - name: Test without external network
        run: sudo env PATH="$PATH" unshare --net -- bash -c 'ip link set lo up; exec "$@"' bash runuser -u "$(id -un)" -- npm test
      - run: npm run build
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      matrix:
        app: [android-phone, android-wear]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Fetch locked dependencies and compile
        run: ./gradlew --no-daemon assembleDebug compileDebugUnitTestKotlin
        working-directory: ${{ matrix.app }}
      - name: Test offline without external network
        run: sudo env PATH="$PATH" JAVA_HOME="$JAVA_HOME" ANDROID_HOME="$ANDROID_HOME" GRADLE_USER_HOME="$HOME/.gradle" unshare --net -- bash -c 'ip link set lo up; exec "$@"' bash ./gradlew --no-daemon --offline testDebugUnitTest
        working-directory: ${{ matrix.app }}
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -f server/Dockerfile -t pushgate-ci:1.0.2 .
