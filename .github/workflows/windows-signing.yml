name: Windows signing preparation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-signing-${{ github.ref }}
  cancel-in-progress: false
jobs:
  sign:
    # Deliberately dormant until Foundation enrollment and public Windows release.
    if: github.repository == 'VACInc/pushgate' && startsWith(github.ref, 'refs/tags/win-v') && vars.SIGNPATH_READY == 'true'
    runs-on: ubuntu-24.04
    environment: windows-signing
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require public build sources and enrollment
        env:
          ORGANIZATION: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          POLICY: ${{ vars.SIGNPATH_POLICY }}
        run: |
          test -n "$ORGANIZATION" && test -n "$POLICY"
          test -f windows/Makefile
          test -f windows/src/version.rc
          test -f windows/tests/load.cpp
      - name: Build from this tag
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends g++-mingw-w64-x86-64-posix
          make -C windows all build/load.exe
          test -f windows/build/PushGateWin.dll
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: unsigned
        with:
          name: windows-unsigned
          path: windows/build/PushGateWin.dll
          if-no-files-found: error
      - uses: SignPath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: pushgate
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1200
          output-artifact-directory: signed
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-signed-candidate
          path: signed/PushGateWin.dll
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-load-probe
          path: windows/build/load.exe
          if-no-files-found: error
  verify:
    needs: sign
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-signed-candidate
          path: candidate
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-load-probe
          path: probe
      - name: Verify publisher, timestamp and actual DLL load
        shell: pwsh
        env:
          EXPECTED_SIGNER: ${{ vars.SIGNPATH_CERT_THUMBPRINT }}
        run: |
          if (-not $env:EXPECTED_SIGNER) { throw 'Configure expected signing certificate thumbprint' }
          $dll = (Resolve-Path candidate/PushGateWin.dll).Path
          $s = Get-AuthenticodeSignature -LiteralPath $dll
          if ($s.Status -ne 'Valid') { throw "Invalid signature: $($s.Status)" }
          if ($s.SignerCertificate.Thumbprint -ne $env:EXPECTED_SIGNER) { throw 'Unexpected publisher certificate' }
          if (-not $s.TimeStamperCertificate) { throw 'Missing timestamp' }
          & ./probe/load.exe $dll
          if ($LASTEXITCODE -ne 0) { throw 'DLL load test failed' }
          Get-FileHash -Algorithm SHA256 -LiteralPath $dll
          Write-Output 'PASS signature, expected publisher, timestamp and DLL load'
